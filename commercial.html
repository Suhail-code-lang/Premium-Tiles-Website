<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bedroom Tiles</title>

<link href="https://cdn.jsdelivr.net/npm/remixicon/fonts/remixicon.css" rel="stylesheet">

<style>

body {
  margin: 0;
  font-family: sans-serif;
  background: #0b0b0b;
  color: white;
}

/* HERO */
.hero {
  position: relative;
  height: 60vh;
}

.hero img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  filter: brightness(60%);
}

.hero h1 {
  position: absolute;
  bottom: 40px;
  left: 30px;
  font-size: 3rem;
}

/* GRID */
.products {
  display: grid;
  grid-template-columns: repeat(4,1fr);
  gap: 25px;
  padding: 50px;
}

/* CARD */
.product-card {
  position: relative;
  background: #111;
  border-radius: 12px;
  overflow: hidden;
  transition: 0.4s;
}

.product-card:hover {
  transform: translateY(-10px) scale(1.03);
}

.product-card img {
  width: 100%;
  height: 250px;
  object-fit: cover;
  cursor: pointer;
}

/* HEART */
.heart {
  position: absolute;
  top: 10px;
  right: 10px;
  background: rgba(0,0,0,0.6);
  padding: 8px;
  border-radius: 50%;
  cursor: pointer;
  z-index: 2;
}

.heart.active i {
  color: red;
}

/* TEXT */
.product-card h3,
.product-card p {
  margin: 10px;
}

.price {
  color: gold;
}

/* BUTTON */
.buy-btn {
  display: inline-block;
  margin: 10px;
  padding: 10px 15px;
  background: gold;
  color: black;
  text-decoration: none;
  border-radius: 5px;
  z-index: 5;
}

/* LIGHTBOX */
#lightbox {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.95);

  display: flex;
  justify-content: center;
  align-items: center;

  opacity: 0;
  pointer-events: none;
  transition: 0.4s;

  z-index: 9999;
}

#lightbox.active {
  opacity: 1;
  pointer-events: all;
}

#lightbox img {
  max-width: 90%;
  max-height: 90%;
  border-radius: 12px;

  transform: scale(0.8);
  transition: 0.4s;
}

#lightbox.active img {
  transform: scale(1);
}

/* CLOSE */
#close-btn {
  position: absolute;
  top: 20px;
  right: 30px;
  font-size: 40px;
  cursor: pointer;
}

/* RESPONSIVE */
@media(max-width:1024px){
  .products {
    grid-template-columns: repeat(2,1fr);
  }
}

@media(max-width:768px){
  .products {
    grid-template-columns: 1fr;
    padding: 20px;
  }
}

</style>
</head>

<body>

<!-- HERO -->
<section class="hero">
  <img src="bedroom-hero.jpg">
  <h1>Commercial Tiles</h1>
</section>

<!-- PRODUCTS -->
<section class="products">

<div class="product-card" data-id="bd1">
<div class="heart" onclick="toggleHeart(this)">
<i class="ri-heart-line"></i>
</div>
<img src="bedroom1.jpg">
<h3>Warm Wood Finish</h3>
<p>600x600 mm</p>
<p class="price">₹110 / sq.ft</p>
<a href="#" class="buy-btn">Enquire</a>
</div>

<div class="product-card" data-id="bd2">
<div class="heart" onclick="toggleHeart(this)">
<i class="ri-heart-line"></i>
</div>
<img src="bedroom2.jpg">
<h3>Matte Cream</h3>
<p>800x800 mm</p>
<p class="price">₹125 / sq.ft</p>
<a href="#" class="buy-btn">Enquire</a>
</div>

<div class="product-card" data-id="bd3">
<div class="heart" onclick="toggleHeart(this)">
<i class="ri-heart-line"></i>
</div>
<img src="bedroom3.jpg">
<h3>Dark Walnut</h3>
<p>600x1200 mm</p>
<p class="price">₹150 / sq.ft</p>
<a href="#" class="buy-btn">Enquire</a>
</div>

<div class="product-card" data-id="bd4">
<div class="heart" onclick="toggleHeart(this)">
<i class="ri-heart-line"></i>
</div>
<img src="bedroom4.jpg">
<h3>Soft Beige</h3>
<p>600x600 mm</p>
<p class="price">₹95 / sq.ft</p>
<a href="#" class="buy-btn">Enquire</a>
</div>

</section>

<!-- LIGHTBOX -->
<div id="lightbox">
<span id="close-btn">&times;</span>
<img id="lightbox-img">
</div>

<script>

/* LIGHTBOX */
const images = document.querySelectorAll(".product-card img");
const lightbox = document.getElementById("lightbox");
const lightboxImg = document.getElementById("lightbox-img");
const closeBtn = document.getElementById("close-btn");

images.forEach(img => {
  img.addEventListener("click", () => {
    lightbox.classList.add("active");
    lightboxImg.src = img.src;
  });
});

closeBtn.onclick = () => lightbox.classList.remove("active");

lightbox.onclick = (e) => {
  if (e.target !== lightboxImg) {
    lightbox.classList.remove("active");
  }
};

/* WISHLIST */
function toggleHeart(el) {
  const card = el.closest(".product-card");
  const id = card.getAttribute("data-id");

  let wishlist = JSON.parse(localStorage.getItem("wishlist")) || [];

  if (wishlist.includes(id)) {
    wishlist = wishlist.filter(item => item !== id);
    el.classList.remove("active");
    el.querySelector("i").classList.replace("ri-heart-fill", "ri-heart-line");
  } else {
    wishlist.push(id);
    el.classList.add("active");
    el.querySelector("i").classList.replace("ri-heart-line", "ri-heart-fill");
  }

  localStorage.setItem("wishlist", JSON.stringify(wishlist));
}

</script>

</body>
</html>
